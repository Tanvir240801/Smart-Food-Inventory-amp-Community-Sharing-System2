{% extends "base.html" %}
{% block title %}Register — FoodShare{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-4">Create account</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" maxlength="100" required></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" maxlength="150" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required><div class="form-text">Minimum 8 characters.</div></div>
<button class="btn btn-dark w-100">Create account</button>
</form>
</div></div></div></div>
{% endblock %}
