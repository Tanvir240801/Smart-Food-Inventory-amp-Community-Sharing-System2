{% extends "base.html" %}
{% block title %}{{ action }} Food — FoodShare{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-4">{{ action }} food item</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Food name *</label><input class="form-control" name="name" maxlength="100" value="{{ item.name if item else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Category</label><input class="form-control" name="category" maxlength="60" value="{{ item.category if item else '' }}" placeholder="e.g. Dairy"></div>
<div class="col-md-4"><label class="form-label">Quantity *</label><input class="form-control" type="number" step="0.01" min="0.01" name="quantity" value="{{ item.quantity if item else '' }}" required></div>
<div class="col-md-4"><label class="form-label">Unit *</label><input class="form-control" name="unit" maxlength="20" value="{{ item.unit if item else '' }}" placeholder="kg, pcs, L" required></div>
<div class="col-md-4"><label class="form-label">Expiry date *</label><input class="form-control" type="date" name="expiry_date" min="{{ today }}" value="{{ item.expiry_date if item else '' }}" required></div>
<div class="col-12"><label class="form-label">Storage location</label><input class="form-control" name="location" maxlength="100" value="{{ item.location if item else '' }}" placeholder="Refrigerator, pantry..."></div>
<div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" maxlength="500" rows="3">{{ item.notes if item else '' }}</textarea></div>
</div>
<div class="mt-4 d-flex gap-2"><button class="btn btn-dark">{{ action }} item</button><a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a></div>
</form>
</div></div></div></div>
{% endblock %}
